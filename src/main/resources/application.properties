spring.application.name=web-template-server
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8100}

management.endpoints.web.exposure.include=health,info
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3100}

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:web_template}
spring.datasource.username=${DB_USERNAME:web_template_user}
spring.datasource.password=${DB_PASSWORD}

# Local HTTP development: false. Set SESSION_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
spring.sql.init.mode=never

springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.with-credentials=true

spring.application.name=web-template-server
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT:8100}

management.endpoints.web.exposure.include=health,info
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3100}

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:web_template}
spring.datasource.username=${DB_USERNAME:web_template_user}
spring.datasource.password=${DB_PASSWORD}
